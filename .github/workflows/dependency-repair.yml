name: CI

on:
  push:
    branches: [main, fix/workbox-security-dependencies]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build production PWA
        run: npm run build
      - name: Verify generated PWA assets
        run: |
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
      - name: Audit all dependencies
        run: npm audit --audit-level=low
